name: Compose Desktop CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs for the same PR/branch
concurrency:
  group: desktop-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # distTar/distZip (application plugin) hit duplicate jar entries, so skip them
      - name: Build Compose Desktop app
        run: ./gradlew :compose-desktop:build -x distTar -x distZip
